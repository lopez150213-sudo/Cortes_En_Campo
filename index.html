<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cortes en Campo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2>Bienvenido al Sistema de Registro de Cortes en Campo</h2>
    <form id="cutForm">
        <div class="form-group">
            <label for="contrato">Número de Contrato</label>
            <input type="text" id="contrato" required inputmode="numeric" placeholder="Ej: 102938">
            <small id="searchStatus" style="display:block; margin-top:5px; color:#666;"></small>
        </div>
        
        <div class="form-group">
            <label for="nombre">Nombre del Cliente</label>
            <input type="text" id="nombre" required readonly placeholder="Se autocompletará..." style="background-color: #e9ecef; cursor: not-allowed;">
        </div>

        <!-- CAMPO ACTUALIZADO: TELÉFONO -->
        <div class="form-group">
            <label for="telefono">Teléfono del Cliente</label>
            <input type="text" id="telefono" required readonly placeholder="Se autocompletará..." style="background-color: #e9ecef; cursor: not-allowed;">
        </div>

   <div class="form-group">
    <label for="gestor">Gestor en Campo</label>
    <select id="gestor" required>
        <option value="" disabled selected>Seleccione un gestor</option>
        <option value="HOLMAN CUEVAS" data-telefono="87964785">HOLMAN CUEVAS</option>
        <option value="ALEJANDRO REYES" data-telefono="82728286">ALEJANDRO REYES</option>
        <option value="GEOVANNY MANZANAREZ" data-telefono="85602699">GEOVANNY MANZANAREZ</option>
        <option value="JOSE BRIZUELA" data-telefono="82852577">JOSE BRIZUELA</option>
        <option value="JOSE MIGUEL" data-telefono="89898646">JOSE MIGUEL</option>
    </select>
</div>
        
        <div class="form-group">
            <label for="estado">Estado del Cliente</label>
            <select id="estado" required>
                <option value="Cortado Poste" selected>Cortado Poste</option>
                <option value="Cortado ONU">Cortado ONU</option>
            </select>
        </div>
        
        <button type="submit" id="btnSubmit" disabled>Enviar y Notificar por WhatsApp</button>
    </form>
    
    <div id="statusMessage"></div>
</div>
    <button type="button" id="btnVerCortes" style="margin-top: 15px; background-color: #0066cc; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold;">
    📊 Ver mis cortes registrados
</button>

<div id="tablaCortesContainer" style="display: none; margin-top: 20px; overflow-x: auto;">
    <h3 style="margin-bottom: 10px;">Historial de Cortes Registrados</h3>
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
        <thead>
            <tr style="background-color: #0066cc; color: white;">
                <th style="padding: 8px;">Fecha/Hora</th>
                <th style="padding: 8px;">Contrato</th>
                <th style="padding: 8px;">Nombre</th>
                <th style="padding: 8px;">Gestor</th>
                <th style="padding: 8px;">Estado</th>
            </tr>
        </thead>
        <tbody id="tbodyCortes">
            <!-- Filas dinámicas -->
        </tbody>
    </table>
</div>

<script src="app.js"></script>
</body>
</html>
